# macOS runner minutes are billed at ten times the Linux rate, so pushes don't start this build: every change
# is tested locally with `make check` first. Run it with `gh workflow run build.yml`, or open a pull request.
name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch or pull request replaces a run still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test, build, and verify app bundle
        run: make check
